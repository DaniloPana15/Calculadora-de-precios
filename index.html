<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Precios y Envío Gratis</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top left, #1a1c29, #0d0e15 60%, #050508);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .box {
            background: rgba(23, 25, 35, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 28px 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        h2 {
            font-family: 'Syne', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ffffff 30%, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #94a3b8;
            display: block;
            margin-bottom: 6px;
        }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
        .input-group { margin-bottom: 16px; }
        input, select {
            width: 100%;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 12px 14px;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
        }
        input:focus, select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        /* BANNER COMPLETO DE IMAGEN (SIN TEXTOS INTERNOS) */
        .courier-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .courier-card {
            background: rgba(15, 23, 42, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            height: 75px; /* Altura generosa para el botón */
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
            padding: 0;
            display: block;
            opacity: 0.5; /* Opaco cuando no está activo */
        }
        .courier-card.active {
            border-color: #6366f1;
            opacity: 1; /* 100% visibilidad al seleccionar */
            box-shadow: 0 0 16px rgba(99, 102, 241, 0.5);
            transform: scale(1.02);
        }
        .courier-card-img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Muestra tu imagen de Canva entera sin deformarla */
            display: block;
        }

        .card-result {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(168, 85, 247, 0.15));
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            text-align: center;
        }
        .card-label { font-size: 0.75rem; font-weight: 600; color: #c084fc; text-transform: uppercase; margin-bottom: 4px; }
        .highlight {
            font-family: 'Syne', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
        }
        hr { border: none; height: 1px; background: rgba(255, 255, 255, 0.08); margin: 16px 0; }
        .res-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: #94a3b8; margin-top: 8px; }
        .res-row span { font-weight: 600; color: #f1f5f9; }
        .res-row.profit span { color: #34d399; }

        .header-label-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .btn-rec {
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: #a5b4fc;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            cursor: pointer;
        }
        .badge-status { font-size: 0.7rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
        .status-low { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .status-good { background: rgba(52, 211, 153, 0.2); color: #34d399; }
        .status-great { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
        
        .subtext-vol { font-size: 0.7rem; color: #818cf8; text-align: right; margin-top: 2px; }
    </style>
</head>
<body>

<div class="box">
    <h2>Armado de Precios</h2>
    
    <!-- Botones de Imagen Pura sin Texto -->
    <label>Empresa de Logística</label>
    <div class="courier-selector">
        <div class="courier-card active" id="btn-ca" onclick="seleccionarCorreo('CA')">
            <img src="ca-logo.png" alt="Correo Argentino" class="courier-card-img">
        </div>
        <div class="courier-card" id="btn-andreani" onclick="seleccionarCorreo('ANDREANI')">
            <img src="andreani-logo.png" alt="Andreani" class="courier-card-img">
        </div>
    </div>

    <!-- Opciones de Ubicación -->
    <div class="grid-2">
        <div>
            <label for="zonaEnvio">Destino</label>
            <select id="zonaEnvio" onchange="calcularCostoFlete()">
                <option value="regional">Regional / Local</option>
                <option value="nacional" selected>Nacional</option>
            </select>
        </div>
        <div>
            <label for="modalidadEnvio">Modalidad</label>
            <select id="modalidadEnvio" onchange="calcularCostoFlete()">
                <option value="sucursal">A Sucursal</option>
                <option value="domicilio" selected>A Domicilio</option>
            </select>
        </div>
    </div>

    <!-- Calculador de Medidas / Volumétrico -->
    <label>Dimensiones del Paquete (CM)</label>
    <div class="grid-3">
        <div>
            <input type="text" id="ancho" placeholder="Ancho" inputmode="numeric" oninput="calcularVolumetrico()">
        </div>
        <div>
            <input type="text" id="alto" placeholder="Alto" inputmode="numeric" oninput="calcularVolumetrico()">
        </div>
        <div>
            <input type="text" id="largo" placeholder="Largo" inputmode="numeric" oninput="calcularVolumetrico()">
        </div>
    </div>

    <div class="grid-2">
        <div>
            <label for="pesoPaquete">Peso Aforo Calculado</label>
            <select id="pesoPaquete" onchange="calcularCostoFlete()">
                <option value="1">Hasta 1 kg</option>
                <option value="5">Hasta 5 kg</option>
                <option value="10">Hasta 10 kg</option>
                <option value="manual">Manual / Convenio</option>
            </select>
            <div id="txtVolumetrico" class="subtext-vol"></div>
        </div>
        <div>
            <label for="costoEnvio">Costo Envío ($)</label>
            <input type="text" id="costoEnvio" inputmode="numeric" placeholder="Calculado..." oninput="formatearEntrada(this)">
        </div>
    </div>

    <!-- Tipo de Envío (Pago) -->
    <div class="input-group">
        <label for="tipoEnvio">Modalidad de Cobro</label>
        <select id="tipoEnvio" onchange="calcular()">
            <option value="estandar">Envío Estándar (Sin cobro en destino)</option>
            <option value="cr">Contra Reembolso (Cobro en destino)</option>
        </select>
    </div>

    <!-- Inputs del Producto -->
    <div class="grid-2">
        <div>
            <label for="costoProducto">Costo Producto ($)</label>
            <input type="text" id="costoProducto" inputmode="numeric" placeholder="Ej: 15.000" oninput="formatearEntrada(this)">
        </div>
        <div>
            <div class="header-label-group">
                <label for="margenGanancia">% Margen</label>
                <button type="button" class="btn-rec" onclick="usarMargenRecomendado()">70%</button>
            </div>
            <input type="text" id="margenGanancia" inputmode="numeric" placeholder="Ej: 70" oninput="calcular()">
        </div>
    </div>

    <!-- Resultado Destacado -->
    <div class="card-result">
        <div class="card-label">Precio Final de Venta (Envío Gratis)</div>
        <span id="precioPublicado" class="highlight">$0</span>
    </div>

    <hr>

    <!-- Desglose -->
    <div class="res-row">
        <span>Ganancia Neta Limpia</span>
        <span id="gananciaNeta">$0</span>
    </div>
    <div class="res-row">
        <span>Comisión de Logística</span>
        <span id="comisionCobrada">$0</span>
    </div>
    <div class="res-row profit">
        <span>Rentabilidad Efectiva</span>
        <div>
            <span id="porcentajeReal">0%</span>
            <span id="badgeEstado" class="badge-status status-low" style="display:none;">Baja</span>
        </div>
    </div>
</div>

<script>
let correoSeleccionado = 'CA';

const TARIFAS = {
    CA: {
        regional: { sucursal: { 1: 14500, 5: 18000, 10: 24000 }, domicilio: { 1: 18400, 5: 21800, 10: 29300 } },
        nacional: { sucursal: { 1: 19500, 5: 24000, 10: 33000 }, domicilio: { 1: 24900, 5: 30200, 10: 42600 } }
    },
    ANDREANI: {
        regional: { sucursal: { 1: 11000, 5: 14500, 10: 19000 }, domicilio: { 1: 13000, 5: 17000, 10: 23000 } },
        nacional: { sucursal: { 1: 14000, 5: 18500, 10: 24000 }, domicilio: { 1: 16500, 5: 22000, 10: 28500 } }
    }
};

function seleccionarCorreo(correo) {
    correoSeleccionado = correo;
    document.getElementById('btn-ca').classList.toggle('active', correo === 'CA');
    document.getElementById('btn-andreani').classList.toggle('active', correo === 'ANDREANI');
    calcularVolumetrico();
}

function calcularVolumetrico() {
    let ancho = parseFloat(document.getElementById('ancho').value) || 0;
    let alto = parseFloat(document.getElementById('alto').value) || 0;
    let largo = parseFloat(document.getElementById('largo').value) || 0;

    let txtVol = document.getElementById('txtVolumetrico');

    if (ancho > 0 && alto > 0 && largo > 0) {
        let pesoVol = (ancho * alto * largo) / 6000;
        txtVol.innerText = "Volumétrico: " + pesoVol.toFixed(2) + " kg";

        let selectPeso = document.getElementById('pesoPaquete');
        if (pesoVol <= 1) {
            selectPeso.value = "1";
        } else if (pesoVol <= 5) {
            selectPeso.value = "5";
        } else {
            selectPeso.value = "10";
        }
    } else {
        txtVol.innerText = "";
    }

    calcularCostoFlete();
}

function calcularCostoFlete() {
    let peso = document.getElementById('pesoPaquete').value;
    let inputEnvio = document.getElementById('costoEnvio');

    if (peso === 'manual') {
        inputEnvio.readOnly = false;
        calcular();
        return;
    }

    inputEnvio.readOnly = true;
    let zona = document.getElementById('zonaEnvio').value;
    let modalidad = document.getElementById('modalidadEnvio').value;

    let tarifaCalculada = TARIFAS[correoSeleccionado][zona][modalidad][peso];
    inputEnvio.value = tarifaCalculada.toLocaleString('es-AR');
    calcular();
}

function usarMargenRecomendado() {
    document.getElementById('margenGanancia').value = '70';
    calcular();
}

function formatearEntrada(input) {
    let valorLimpio = input.value.replace(/\D/g, '');
    if (valorLimpio) {
        input.value = parseInt(valorLimpio, 10).toLocaleString('es-AR');
    } else {
        input.value = '';
    }
    calcular();
}

function obtenerNumero(id) {
    let val = document.getElementById(id).value.replace(/\D/g, '');
    return val ? parseFloat(val) : 0;
}

function calcular() {
    let costoProd = obtenerNumero('costoProducto');
    let costoEnvio = obtenerNumero('costoEnvio');
    let margen = obtenerNumero('margenGanancia');
    let tipoEnvio = document.getElementById('tipoEnvio').value;
    let badge = document.getElementById('badgeEstado');

    if (costoProd <= 0) {
        document.getElementById('precioPublicado').innerText = "$0";
        document.getElementById('gananciaNeta').innerText = "$0";
        document.getElementById('comisionCobrada').innerText = "$0";
        document.getElementById('porcentajeReal').innerText = "0%";
        badge.style.display = "none";
        return;
    }

    let gananciaObjetivo = costoProd * (margen / 100);
    let subtotalNecesario = costoProd + gananciaObjetivo + costoEnvio;

    let tasaComision = 0;
    if (tipoEnvio === 'cr') {
        tasaComision = (correoSeleccionado === 'CA') ? 0.05 : 0.06;
    }

    let precioFinal = Math.ceil(subtotalNecesario / (1 - tasaComision));
    let comisionMonto = Math.round((precioFinal * tasaComision) * 100) / 100;
    let gananciaLimpia = precioFinal - comisionMonto - costoEnvio - costoProd;
    let rentabilidadEfectiva = ((gananciaLimpia / costoProd) * 100).toFixed(1);

    document.getElementById('precioPublicado').innerText = "$" + precioFinal.toLocaleString('es-AR');
    document.getElementById('gananciaNeta').innerText = "$" + Math.round(gananciaLimpia).toLocaleString('es-AR');
    document.getElementById('comisionCobrada').innerText = "$" + comisionMonto.toLocaleString('es-AR');
    document.getElementById('porcentajeReal').innerText = rentabilidadEfectiva + "% ";

    badge.style.display = "inline-block";
    if (margen < 40) {
        badge.innerText = "Riesgo";
        badge.className = "badge-status status-low";
    } else if (margen <= 80) {
        badge.innerText = "Saludable";
        badge.className = "badge-status status-good";
    } else {
        badge.innerText = "Excelente";
        badge.className = "badge-status status-great";
    }
}

// Inicializar flete
calcularCostoFlete();
</script>

</body>
</html>
