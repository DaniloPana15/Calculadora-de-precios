<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Contra Reembolso</title>
    
    <!-- Ícono para pestañas de navegador en PC -->
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- Ícono para acceso directo en pantalla de inicio de celulares (Android e iOS) -->
    <link rel="apple-touch-icon" href="favicon.png">

    <!-- Importación de tipografías: Syne (encabezados) y Plus Jakarta Sans (cuerpo/números) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top left, #1a1c29, #0d0e15 60%, #050508);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            background: rgba(23, 25, 35, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 32px 28px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
        }

        h2 {
            font-family: 'Syne', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #ffffff 30%, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .input-group {
            margin-bottom: 24px;
        }

        label {
            font-size: 0.825rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #94a3b8;
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 14px 16px;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            background: rgba(15, 23, 42, 0.9);
        }

        input::placeholder {
            color: #475569;
            font-weight: 400;
        }

        .card-result {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.12), rgba(168, 85, 247, 0.12));
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .card-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #c084fc;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .highlight {
            font-family: 'Syne', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
        }

        hr {
            border: none;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin: 20px 0;
        }

        .res-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 10px;
        }

        .res-row span {
            font-weight: 600;
            color: #f1f5f9;
        }

        .res-row.final span {
            color: #34d399;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Contra Reembolso</h2>
    
    <div class="input-group">
        <label for="precioBase">Precio en mano ($)</label>
        <input type="text" id="precioBase" inputmode="numeric" placeholder="Ej: 53.700" oninput="formatearYCalcular(this)">
    </div>

    <div class="card-result">
        <div class="card-label">Monto para la tarjeta</div>
        <span id="montoTarjeta" class="highlight">$0</span>
    </div>

    <hr>

    <div class="res-row">
        <span>Comisión Correo (5%)</span>
        <span id="comision">$0</span>
    </div>
    
    <div class="res-row final">
        <span>Cobrás en mano</span>
        <span id="montoFinal">$0</span>
    </div>
</div>

<script>
function formatearYCalcular(input) {
    let valorLimpio = input.value.replace(/\D/g, '');

    if (!valorLimpio) {
        input.value = '';
        document.getElementById('montoTarjeta').innerText = "$0";
        document.getElementById('comision').innerText = "$0";
        document.getElementById('montoFinal').innerText = "$0";
        return;
    }

    let numero = parseInt(valorLimpio, 10);
    input.value = numero.toLocaleString('es-AR');

    let tarjeta = Math.ceil(numero / 0.95);
    let comision = Math.round((tarjeta * 0.05) * 100) / 100;
    let final = (tarjeta - comision).toFixed(2);

    document.getElementById('montoTarjeta').innerText = "$" + tarjeta.toLocaleString('es-AR');
    document.getElementById('comision').innerText = "$" + comision.toLocaleString('es-AR');
    document.getElementById('montoFinal').innerText = "$" + parseFloat(final).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
</script>

</body>
</html>
